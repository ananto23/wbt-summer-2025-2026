<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Donation Form</title>
</head>
<body>

    <p>* - Denotes Required Information</p>

    <p>
        <strong>> 1 Donation</strong> &nbsp;&nbsp;
        > 2 Confirmation &nbsp;&nbsp;
        > Thank You!
    </p>

    <h2 style="color:red;">Donor Information</h2>

    <form>

        <table>
            <tr>
                <td><label>First Name*</label></td>
                <td><input type="text" required></td>
            </tr>

            <tr>
                <td><label>Last Name*</label></td>
                <td><input type="text" required></td>
            </tr>

            <tr>
                <td><label>Company</label></td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td><label>Address 1*</label></td>
                <td><input type="text" required></td>
            </tr>

            <tr>
                <td><label>Address 2</label></td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td><label>City*</label></td>
                <td><input type="text" required></td>
            </tr>

            <tr>
                <td><label>State*</label></td>
                <td>
                    <select required>
                        <option>Select a State</option>
                        <option>Dhaka</option>
                        <option>Chattogram</option>
                        <option>Khulna</option>
                        <option>Rajshahi</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label>Zip Code*</label></td>
                <td><input type="text" required></td>
            </tr>

            <tr>
                <td><label>Country*</label></td>
                <td>
                    <select required>
                        <option>Select a Country</option>
                        <option>Bangladesh</option>
                        <option>India</option>
                        <option>USA</option>
                        <option>UK</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><label>Phone</label></td>
                <td><input type="tel"></td>
            </tr>

            <tr>
                <td><label>Fax</label></td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td><label>Email*</label></td>
                <td><input type="email" required></td>
            </tr>
        </table>

        <br>

        <label><strong>Donation Amount*</strong></label><br>
        <small>(Check a button or type in your amount)</small><br>

        <input type="radio" name="donation"> None
        <input type="radio" name="donation"> $50
        <input type="radio" name="donation"> $75
        <input type="radio" name="donation"> $100
        <input type="radio" name="donation"> $250
        <input type="radio" name="donation"> Other

        <br><br>

        <label>Other Amount $</label>
        <input type="text">

        <br><br>

        <label><strong>Recurring Donation</strong></label>
        <input type="checkbox">
        I am interested in giving on a regular basis.

        <br>
        <small>(Check if yes)</small>

        <br><br>

        Monthly Credit Card $
        <input type="text" size="5">

        For
        <input type="text" size="5">

        Months

        <br><br>

        <input type="submit" value="Donate">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
