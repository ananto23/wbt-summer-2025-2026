<!DOCTYPE html>
<html lang="en">
<head>
    <title>Donor Information</title>
</head>

<body>

    <form method="post">

        <fieldset>
            <legend>Registration Form</legend>

            <table>

                 <!-- First Name -->
                <tr>
                    <td><label for="first_name">First Name*:</label></td>
                    <td>
                        <input type="text" id="first_name" name="first_name" required>
                    </td>
                </tr>

                <!-- Last Name -->
                <tr>
                    <td><label for="last_name">Last Name*:</label></td>
                    <td>
                        <input type="text" id="last_name" name="last_name" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="company">Company:</label></td>
                    <td>
                        <input type="text" id="company" name="Company" required>
                    </td>
                </tr>


                <tr>
                    <td><label for="Address 1">Address 1*:</label></td>
                    <td>
                        <input type="text" id="Address 1" name="Address 1*" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="Address 2">Address 2:</label></td>
                    <td>
                        <input type="text" id="Address 2" name="Address 2" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="city">City:</label></td>
                    <td>
                        <input type="text" id="city" name="City" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="state">State:</label></td>
                    <td>
                        <select id="state" name="state">
                            <option>Dhaka</option>
                            <option>Chittagang</option>
                            <option>Sylhet</option>
                            <option>Khulna</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="zip code">zip Code*:</label></td>
                    <td>
                        <input type="text" id="zip code" name="Zip Code*" required>
                    </td>
                </tr>


                 <tr>
                    <td><label for="country">Country:</label></td>
                    <td>
                        <select id="country" name="country">
                            <option>Bangladesh</option>
                            <option>India</option>
                            <option>USA</option>
                            <option>UK</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="phone">Phone:</label></td>
                    <td>
                        <input type="tel" id="phone" name="Phone" required>
                    </td>
                </tr>

                <tr>
                    <td><label for="fax">Fax:</label></td>
                    <td>
                        <input type="text" id="fax" name="Fax" required>
                    </td>
                </tr>


            <!-- Email -->
                <tr>
                    <td><label for="email">Email:</label></td>
                    <td>
                        <input type="email" id="email" name="email" required>
                    </td>
                </tr>

                <!-- Donation Amount -->
                <tr>
                    <td> <label><strong>Donation Amount*</strong></label><br>
        <small>(Check a button or type in your amount)</small><br></td>
                    <td>
                        <input type="radio" name="Donation Amount" value="none"> None
                        <input type="radio" name="Donation Amount" value="$50"> $50
                        <input type="radio" name="Donation Amount" value="$75"> $75
                        <input type="radio" name="Donation Amount" value="$100"> $100
                        <input type="radio" name="Donation Amount" value="$250"> $250
                        <input type="radio" name="Donation Amount" value="other"> other
                    <br>
                    <label> Other Amount $</label>
        <input type="text">    
                    </br>
                    </td>
                </tr> 
                
                <!-- Recurring Donation -->
                <tr>
                    <td><label><strong>Recurring Donation</strong></label>
        <input type="checkbox">
        I am interested in giving on a regular basis</td>
                   
                </tr>

                
            <!-- Buttons -->
                <tr>
                    <td></td>
                    <td>
                        <input type="submit" value="Register">
                        <input type="reset" value="Clear">
                    </td>
                </tr>

            </table>

        </fieldset>

    </form>

</body>
</html>
