<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create Your Account</title>
</head>

<body>

    <form class="card">

        <h1>Create your account</h1>
        <p>Join us in a couple of steps.</p> 

        <div class="card-body">

            <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" placeholder="Ananta Saha">
            </div>

            <div class="field">
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="28">
            </div>

            <div class="field">
                <label for="dob">Date of birth</label>
                <input type="date" id="dob" value="2026-06-25">
            </div>

            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="anantosaha35@gmail.com">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 characters">
            </div>

            <div class="field">
                <label>Preferred contact</label>

                <label class="radio">
                    <input type="radio" name="contact" checked>
                    <span>Email</span>
                </label>

                <label class="radio">
                    <input type="radio" name="contact">
                    <span>Phone</span>
                </label>

                <label class="radio">
                    <input type="radio" name="contact">
                    <span>SMS</span>
                </label>
            </div>

            <div class="buttons">
                <button type="submit" class="btn-primary">
                    Submit
                </button>

                <button type="reset" class="btn-secondary">
                    Reset
                </button>
            </div>

        </div>

    </form>

</body>
</html>
